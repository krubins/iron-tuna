name: checks

# There is no build step and no package manager in this repo (see HANDOFF.md §2),
# so nothing here installs anything — every check is plain node against the files
# that actually deploy.
on:
  pull_request:
  push:
    branches: [main]

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # A single bad escape silently white-screens the whole app, so parsing the
      # deployed files is the highest-value check in the repo.
      - name: Parse _worker.js
        run: node --check _worker.js

      - name: Parse the index.html app script
        run: |
          node -e '
            const fs = require("fs");
            const h = fs.readFileSync("index.html", "utf8");
            const m = h.match(/<script type="module">([\s\S]*?)<\/script>/);
            if (!m) { console.error("no <script type=module> block found"); process.exit(1); }
            new Function(m[1]);
            console.log("index.html PARSE OK");
          '

      - name: Parse the front.html scripts
        run: |
          node -e '
            const fs = require("fs");
            const h = fs.readFileSync("front.html", "utf8");
            const blocks = [...h.matchAll(/<script>([\s\S]*?)<\/script>/g)];
            if (!blocks.length) { console.error("no <script> blocks found"); process.exit(1); }
            blocks.forEach(b => new Function(b[1]));
            console.log("front.html PARSE OK (" + blocks.length + " blocks)");
          '

      - name: Parse the lead.html scripts
        run: |
          node -e '
            const fs = require("fs");
            const h = fs.readFileSync("lead.html", "utf8");
            const blocks = [...h.matchAll(/<script>([\s\S]*?)<\/script>/g)];
            if (!blocks.length) { console.error("no <script> blocks found"); process.exit(1); }
            blocks.forEach(b => new Function(b[1]));
            console.log("lead.html PARSE OK (" + blocks.length + " blocks)");
          '

      - name: Parse the player.html scripts
        run: |
          node -e '
            const fs = require("fs");
            const h = fs.readFileSync("player.html", "utf8");
            const blocks = [...h.matchAll(/<script>([\s\S]*?)<\/script>/g)];
            if (!blocks.length) { console.error("no <script> blocks found"); process.exit(1); }
            blocks.forEach(b => new Function(b[1]));
            console.log("player.html PARSE OK (" + blocks.length + " blocks)");
          '

      # The lookup index and the widget that reads it ship as one plain file,
      # loaded by front.html and player.html alike, so a syntax error there
      # takes out the search box on every page at once.
      - name: Parse player-search.js
        run: node --check player-search.js

      - name: Parse the analyst-desk.html scripts
        run: |
          node -e '
            const fs = require("fs");
            const h = fs.readFileSync("analyst-desk.html", "utf8");
            const blocks = [...h.matchAll(/<script>([\s\S]*?)<\/script>/g)];
            if (!blocks.length) { console.error("no <script> blocks found"); process.exit(1); }
            blocks.forEach(b => new Function(b[1]));
            console.log("analyst-desk.html PARSE OK (" + blocks.length + " blocks)");
          '

      # /admin is the only page with a form that calls an API, and it is
      # hand-written like the rest — a syntax error there breaks the dashboard
      # and the comp-access form with it, silently, since nobody browses it.
      - name: Parse the admin.html scripts
        run: |
          node -e '
            const fs = require("fs");
            const h = fs.readFileSync("admin.html", "utf8");
            const blocks = [...h.matchAll(/<script>([\s\S]*?)<\/script>/g)];
            if (!blocks.length) { console.error("no <script> blocks found"); process.exit(1); }
            blocks.forEach(b => new Function(b[1]));
            console.log("admin.html PARSE OK (" + blocks.length + " blocks)");
          '

      - name: Parse wrangler.jsonc
        run: |
          node -e '
            const fs = require("fs");
            JSON.parse(fs.readFileSync("wrangler.jsonc", "utf8").replace(/^\s*\/\/.*$/gm, ""));
            console.log("wrangler.jsonc OK");
          '

      # HANDOFF.md §3 documents an escape-corruption bug that has bitten this repo
      # three times: a control byte written into a file literally instead of as an
      # escape. A literal newline in a regex is a SyntaxError the parse checks
      # above already catch — but a literal backspace (0x08) inside a regex parses
      # fine and then silently never matches. Only a byte scan finds that one.
      - name: No stray control bytes in deployed source
        run: |
          node -e '
            const fs = require("fs");
            const files = ["index.html", "front.html", "lead.html", "player.html", "player-search.js", "analyst-desk.html", "the-pick.html", "play-caller-premium.html", "_worker.js"];
            let bad = 0;
            for (const f of files) {
              const buf = fs.readFileSync(f);
              for (let i = 0; i < buf.length; i++) {
                const c = buf[i];
                // Allow tab (9), newline (10), carriage return (13).
                if (c < 0x20 && c !== 9 && c !== 10 && c !== 13) {
                  const line = buf.slice(0, i).toString("utf8").split("\n").length;
                  console.error(`${f}:${line} stray control byte 0x${c.toString(16).padStart(2, "0")}`);
                  bad++;
                  if (bad > 20) { console.error("...more"); process.exit(1); }
                }
              }
            }
            if (bad) process.exit(1);
            console.log("no stray control bytes");
          '

      # The re-skin that renamed --red to --brand landed while The Pick was on a
      # branch, and the two changes touched different lines of front.html — so git
      # merged them with no conflict and every check above stayed green while
      # shipping `color: var(--red)` against a property that no longer existed. An
      # undefined custom property is not a parse error; the declaration is just
      # thrown away. Nothing else in this repo reads CSS, so nothing else can see
      # it. It found two older ones in index.html on its first run.
      - name: Every var(--token) resolves to a definition
        run: node tools/test-css-tokens.mjs

      # front.html embeds STORIES/REPORTS extracted from the drop and auction-watch
      # pages. Adding a page without re-running build-front.mjs leaves that array
      # stale — which is exactly how Top Headlines got stuck showing an old camp
      # report. Rebuilding here must produce no diff.
      #
      # The same run also writes the player lookup index into player-search.js
      # (the ribbon's search box and every /player/<slug> card read it) and the
      # STORIES array into player.html, so all three are checked together — a
      # stale index means a player the site prices that the box cannot find.
      - name: front.html is rebuilt from its source pages
        run: |
          node tools/build-front.mjs
          if ! git diff --quiet -- front.html player-search.js player.html; then
            echo "::error file=front.html::the generated front-page data is stale — run 'node tools/build-front.mjs' and commit the result"
            git --no-pager diff --stat -- front.html player-search.js player.html
            exit 1
          fi
          echo "front.html, player-search.js and player.html are up to date"

      # Google Analytics collects NOTHING from a page that does not configure the
      # GA4 destination, and the failure is silent: the page renders, the Ads tag
      # keeps converting, and the only symptom is a property that says "no data
      # received". A page added without running build-seo.mjs also gets no Article
      # JSON-LD, no sitemap lastmod, and — for a camp report — no static link from
      # the front page, leaving it reachable only from sitemap.xml. Same contract
      # as the front.html step above: rebuilding here must produce no diff.
      #
      # build-seo.mjs reads `git log` for the guides' dates, and this checkout is
      # shallow, so it detects that and carries the committed dates forward rather
      # than dating every guide to the checkout commit. No fetch-depth needed.
      - name: The discovery layer is rebuilt from the pages that exist
        run: |
          if ! node tools/build-seo.mjs --check; then
            echo "::error::the discovery layer is stale — run 'node tools/build-seo.mjs' and commit the result"
            exit 1
          fi

      - name: Analytics tagging, structured data and crawlability
        run: node tools/test-seo.mjs

      # The nav and footer are generated from one link set in build-chrome.mjs.
      # Hand-editing them in 94 files is how they drifted into 10 nav variants
      # and 13 footer variants in the first place, leaving whole sections
      # unreachable from some pages. Same contract as the two gates above:
      # rebuilding here must produce no diff.
      - name: The header and footer are rebuilt from the canonical link set
        run: |
          if ! node tools/build-chrome.mjs --check; then
            echo "::error::the chrome is stale — run 'node tools/build-chrome.mjs' and commit the result"
            exit 1
          fi

      - name: Every destination is reachable and the chrome is well-formed
        run: node tools/test-chrome.mjs

      # The scrolling cheat-sheet insights are hand-written prose with no build
      # step, so nothing used to notice when a note outlived the roster it
      # described — by August 2026 eight of the eleven backfield notes named
      # players who had changed teams or left the board, and one still called a
      # second-year back a rookie. This holds that prose to the same player pool
      # the boards price from.
      - name: Insight prose against the player pool
        run: node tools/test-insights.mjs

      # LEAD_FACES in _worker.js is generated from tools/nfl-headshots.json and the
      # PROJECTIONS pool. A projections update that adds or moves a player leaves
      # it stale, and the symptom is a missing or wrongly-captioned face on the
      # front page's lead — quiet enough to ship. Rebuilding here must be a no-op.
      - name: _worker.js lead faces are rebuilt from their sources
        run: |
          node tools/build-worker-faces.mjs
          if ! git diff --quiet -- _worker.js; then
            echo "::error file=_worker.js::LEAD_FACES is stale — run 'node tools/build-worker-faces.mjs' and commit the result"
            git --no-pager diff --stat -- _worker.js
            exit 1
          fi
          echo "LEAD_FACES is up to date"

      # The odds math is duplicated between _worker.js and tools/ because there is
      # no bundler; test-worker-odds.mjs lifts the worker's copy out of the source
      # and asserts the two still agree, so drift fails here instead of quietly
      # changing the numbers people draft on. It also pulls the live nflverse file
      # — that step self-skips on a network blip rather than failing the build.
      - name: Odds pipeline tests (build-time tools)
        run: node tools/test-vegas.mjs

      - name: Odds pipeline tests (worker, incl. worker/tool sync)
        run: node tools/test-worker-odds.mjs

      # Everything else with assertions in tools/. These are plain node, no
      # network beyond what the odds suites already pull, and they cover the
      # pieces most likely to drift: the reader's own-league pricing, the Vegas
      # column's worker/client scoring sync, and the generated lead story's
      # fallback behaviour.
      - name: Per-league pricing and the front page's contract with it
        run: node tools/test-it-league.mjs

      - name: The generated lead story and its admin desk
        run: node tools/test-lead-story.mjs

      # The worker rewrites a few routes onto other assets ("/" -> front.html,
      # /lead/<slug> -> lead.html). Cloudflare's default html_handling answers a
      # ".html" request with a redirect to the extensionless path, so a rewrite
      # aimed at "<name>.html" hands the browser a redirect instead of the page —
      # and on /lead that redirect points back at /lead, which is an infinite loop
      # (ERR_TOO_MANY_REDIRECTS, shipped 2026-08-21). Nothing in the worker source
      # shows it; it takes the assets layer's rules to see it.
      - name: Route rewrites resolve without redirecting or looping
        run: node tools/test-asset-routing.mjs

      - name: The standing analyst column
        run: node tools/test-analyst-column.mjs

      - name: The reading view's palette, across all three pages
        run: node tools/test-reading-view.mjs

      # The Pick is written a story a day by a Routine, in prose, with tables of
      # projection numbers in it. Nothing about prose stops it naming a player
      # who left the board, putting him on last year's club, or printing a point
      # total the projection set does not contain — and all three read as
      # confident advice. This holds the column to the same pool the boards price
      # from, and to the markup /it-league.js needs to translate it.
      - name: The Pick, against the player pool it prices from
        run: node tools/test-the-pick.mjs

      # The Build desk states a budget, so it has to account for that budget.
      # It once published the starters ($183) under a headline quoting the whole
      # board ($200) and never mentioned the bench that spends the difference,
      # which reads as a solve leaving value behind (HANDOFF.md §24). This holds
      # the shipped ANALYSIS block and the render to that ledger. Its rendered
      # sweep needs Chromium and self-skips here; the numbers half is plain node.
      - name: The Build accounts for the whole budget
        run: node tools/test-build-desk.mjs

      - name: What the board grades a player name against
        run: node tools/test-board-colour.mjs

      # The ribbon's player lookup and the /player/<slug> card it lands on. The
      # index is generated from PROJECTIONS, so a projections update that skips
      # tools/build-front.mjs leaves the box unable to find a player the site is
      # actively pricing — and the box does not say "my index is old", it says
      # "No player by that name on the board".
      - name: The player lookup and the card it lands on
        run: node tools/test-player-card.mjs

      - name: Vegas column (worker)
        run: node tools/test-worker-column.mjs

      - name: Vegas rank chips on the boards
        run: node tools/test-vegas-rank-chip.mjs

      - name: Admin grant and revoke
        run: node tools/test-admin-grant.mjs

      # The counter that must never cost a page view, and the numbers on /admin
      # that must never overstate the site. Written in Aug 2026 but never wired
      # up here, so it was only ever run by hand.
      - name: Traffic analytics
        run: node tools/test-analytics.mjs

      # /api/admin/comp grants access and then puts a working sign-in link in
      # someone's inbox, so its failure modes are the ones that look like
      # success: a link mailed to an address the grant never reached, an email
      # Resend refused while the response still said ok. This follows the link
      # it emits all the way through /api/auth/verify to /api/auth/me.
      - name: Comping access and mailing the link
        run: node tools/test-admin-comp.mjs

      # NOT run here: tools/test-position-lens.mjs, tools/test-you-column.mjs,
      # tools/test-market-anchors.mjs, tools/test-vegas-slider.mjs,
      # tools/test-qb-curve.mjs and tools/test-faab.mjs.
      # All drive real Chromium and self-skip without playwright-core plus a
      # browser binary. Adding them without installing those would give a green
      # step that never actually ran, which is worse than not claiming coverage.
      # Run them locally (CHROMIUM_PATH=... node tools/test-position-lens.mjs)
      # when touching the ribbon's edition switch, Position Intel, the lead, the
      # cheat-sheet columns or the FAAB advisor's bid maths.
