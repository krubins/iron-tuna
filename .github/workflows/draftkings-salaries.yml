name: DraftKings weekly salaries

on:
  # This push trigger causes an immediate production import when this fix lands
  # on main. It can be removed after the first successful run if desired.
  push:
    branches: [main]
    paths:
      - 'tools/import-draftkings-salaries.mjs'
      - '.github/workflows/draftkings-salaries.yml'
  schedule:
    # Cron is UTC and does not follow New York clocks. The three slots below
    # are 6 AM and 10 AM Tuesday and 10 AM Wednesday EDT (an hour earlier in
    # EST). The first runs before anyone is reading, the second and third
    # cover a lobby DraftKings posts late. The same slots are mirrored in
    # DFS_IMPORT_SCHEDULE in _worker.js, which is what the reader is told; the
    # importer test holds the two in step, so change both together.
    - cron: '0 10 * * 2'
    - cron: '0 14 * * 2'
    - cron: '0 14 * * 3'
  workflow_dispatch:
    inputs:
      draft_group_id:
        description: Optional DraftKings draft group override
        required: false
        type: string
      week:
        description: Optional NFL week override
        required: false
        type: string
      dry_run:
        description: Discover and validate without importing
        required: false
        default: false
        type: boolean

permissions:
  contents: read
  id-token: write

concurrency:
  group: draftkings-salaries
  cancel-in-progress: false

jobs:
  import:
    runs-on: ubuntu-latest
    # Raised from 5 when the single-game import landed: the job now makes one
    # draftables call and one POST per Showdown group on top of the Classic
    # pools, which is roughly sixteen more of each on a full Sunday.
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Find and import the weekly Classic pool and each single-game slate
        env:
          IRON_TUNA_ADMIN_URL: ${{ vars.IRON_TUNA_ADMIN_URL }}
          INPUT_DRAFT_GROUP_ID: ${{ inputs.draft_group_id }}
          INPUT_WEEK: ${{ inputs.week }}
          INPUT_DRY_RUN: ${{ inputs.dry_run }}
        run: node tools/import-draftkings-salaries.mjs
